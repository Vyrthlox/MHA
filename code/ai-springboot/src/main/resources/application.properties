spring.application.name=ai-springboot

# ===================== 本地大模型密钥 =====================
# 密钥不再从 tmp/.env 文件读取，全部来自「环境变量」：
#   API_KEY      必填，模型服务商的 API Key
#   BASE_URL     可选，OpenAI 兼容接口地址（默认 https://api.openai.com）
#   MODEL_NAME   可选，模型名（兼容旧名 MODEL）
# Windows 设置示例（设置后需重开终端 / 重启 IDE 才生效）：
#   setx API_KEY "sk-xxx"
#   setx BASE_URL "https://api.deepseek.com"
#   setx MODEL_NAME "deepseek-v4-flash"
# 也可以直接在 IDE 的 Run Configuration 或部署环境中注入。

# ===================== MySQL 数据源 =====================
spring.datasource.url=jdbc:mysql://localhost:3306/MHAData?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=000000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================== HikariCP 连接池 =====================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===================== 服务端口与上下文路径 =====================
# 前端 vite 代理把 /api 原样转发到 8080，因此这里提供 /api 前缀。
# 用 context-path 而不是给每个 Controller 写 @RequestMapping("/api/...")：
# /api 是路由层概念（区分 API 与静态资源），属于配置而非业务映射，
# 后续新增 Controller 无需重复前缀。
server.port=8080
server.servlet.context-path=/api

# ===================== JWT =====================
# HS256 要求密钥 >= 256 bit（32 字节）。短于 32 字节时 Keys.hmacShaKeyFor()
# 会抛 WeakKeyException，导致应用启动失败。本值 45 字符。
# 生产环境请改为从环境变量注入，例如：jwt.secret=${JWT_SECRET}
jwt.secret=MHAData-jwt-secret-key-please-change-2026-1024
# token 有效期（秒），默认 2 小时
jwt.expire-seconds=7200
jwt.issuer=ai-springboot

# ===================== Spring AI（OpenAI 兼容接口） =====================
# 本功能（登录/注册）不使用 AI，但 Spring AI 的 OpenAI 自动配置在启动时就必须能拿到凭证，
# 否则六个模型自动配置（chat/embedding/image/audio.speech/audio.transcription/moderation）
# 之一会抛 "At least one credential source must be specified" 导致整个应用启动失败。
# 因此这里用「环境变量 + 占位默认值」：不配置也能启动；接入真实模型时设置 API_KEY 即可。
# 换厂商（DeepSeek / 通义千问 / Kimi 等）只需改 BASE_URL 与 MODEL_NAME。
# 同时兼容标准的 OPENAI_* 环境变量，方便在 CI / 容器里直接复用。
spring.ai.openai.api-key=${API_KEY:${OPENAI_API_KEY:not-configured}}
spring.ai.openai.base-url=${BASE_URL:${OPENAI_BASE_URL:https://api.openai.com}}
spring.ai.openai.chat.options.model=${MODEL_NAME:${MODEL:${OPENAI_MODEL:gpt-4o-mini}}}

# 聊天模型用 OpenAI 兼容接口（DeepSeek），Embedding 用本地 Ollama。
# 不写这两行时，OpenAI 的 embedding 自动配置也会生效；DeepSeek 没有 embedding 接口，
# 一旦走到就会报 404，所以必须把 embedding 明确切到 ollama。
spring.ai.model.chat=openai
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:bge-m3}

# ===================== Milvus（长期记忆向量库） =====================
# 集合由应用启动时自动创建（initialize-schema=true），维度必须与 bge-m3 一致（1024）。
# 换 embedding 模型/维度时，必须先删除集合或 Milvus 数据卷再启动。
spring.ai.vectorstore.milvus.client.host=${MILVUS_HOST:localhost}
spring.ai.vectorstore.milvus.client.port=${MILVUS_PORT:19530}
spring.ai.vectorstore.milvus.collection-name=mha_long_term_memory
spring.ai.vectorstore.milvus.embedding-dimension=1024
spring.ai.vectorstore.milvus.initialize-schema=true
spring.ai.vectorstore.milvus.metric-type=COSINE
spring.ai.vectorstore.milvus.index-type=HNSW
spring.ai.vectorstore.milvus.index-parameters={"M":16,"efConstruction":200}

# ===================== Redis（注册验证码） =====================
# 验证码、冷却标记、失败计数全放这里。见 service/EmailCodeService。
# Redis 没起也不影响应用启动：Lettuce 默认懒连接（eagerInitialization=false），
# 只有真正读写 Redis 时才会报连接错误。
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=3000ms

# ===================== 邮件（双模式） =====================
# 不配 spring.mail.host → 没有 JavaMailSender bean，验证码改为输出到后端日志，
# 其余流程（冷却、过期、作废、校验）完全一致，可以先把整条链路联调通。
# 要真发邮件时取消注释，注意 password 填的是邮箱的「授权码」不是登录密码：
# spring.mail.host=smtp.qq.com
# spring.mail.port=465
# spring.mail.username=you@qq.com
# spring.mail.password=${MAIL_AUTH_CODE}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.ssl.enable=true
mha.mail.from=${MAIL_FROM:no-reply@mha.local}

# ===================== 邮箱验证码策略 =====================
mha.email-code.expire-seconds=300
mha.email-code.cooldown-seconds=60
mha.email-code.max-attempts=5

# ===================== MongoDB（对话记忆） =====================
# Spring Boot 4 起连接属性从 spring.data.mongodb.* 迁到了 spring.mongodb.*；
# 旧键不会报错但会被忽略，Boot 会退回默认的 mongodb://localhost/test。
# 必须用 spring.mongodb.uri，否则会话和消息会写进 test 库。
spring.mongodb.uri=mongodb://localhost:27017/MHAData
# 应用启动时按 @CompoundIndex 建索引（默认 false，不打开的话注解只是注释）
spring.data.mongodb.auto-index-creation=true

# 短期记忆：每次请求带给模型的历史消息条数（消息数，不是轮次）。
# 16 条 = 8 轮，对应《上下文工程》里的“前 8 轮对话”。
# 完整历史始终留在 chat_messages，窗口只影响模型上下文。
mha.chat-memory.max-messages=16
# 会话标题取首条用户消息的前 N 个字符，列表预览取最后一条消息的前 N 个字符
mha.chat-memory.title-max-length=20
mha.chat-memory.preview-max-length=60

# ===================== 三层记忆 =====================
# 长期记忆召回：先按 userId/type/时间过滤，再按余弦相似度取前 K 条
mha.memory.recall-top-k=5
mha.memory.recall-min-score=0.55
mha.memory.recall-window-days=30
# stable 记忆不受窗口限制；temporary 记忆 7 天后过期
mha.memory.temporary-ttl-days=7
# Redis 工作记忆 TTL
mha.memory.working-ttl-days=7
# 删除会话后：normal 记忆进入 30 天保留期，期间被召回则顺延；
# important 记忆与用户画像不参与自动清理
mha.memory.retention-days=30
mha.memory.retention-enabled=true
mha.memory.retention-poll-interval-ms=3600000
mha.memory.retention-batch-size=200
# 提示词预算（字符数）
mha.memory.profile-max-chars=500
mha.memory.memory-snippet-max-chars=160
mha.memory.task-max-chars=600
# 单轮最多接受多少条新记忆
mha.memory.max-memories-per-turn=6
# Milvus SDK 故障时会自行重试几十次，必须由调用方限时等待；
# 超时/失败后冷却一段时间，期间直接按“无记忆”降级
mha.memory.vector-read-timeout-ms=5000
mha.memory.vector-write-timeout-ms=15000
mha.memory.vector-cooldown-seconds=30

# 异步提炼（MySQL outbox + 90 秒防抖）
mha.memory.extract.enabled=true
mha.memory.extract.debounce-seconds=90
mha.memory.extract.max-attempts=3
mha.memory.extract.poll-interval-ms=15000
mha.memory.extract.batch-size=5
mha.memory.extract.max-messages=40
mha.memory.extract.max-chars=12000
mha.memory.extract.stale-minutes=10
mha.memory.extract.retry-base-seconds=30
